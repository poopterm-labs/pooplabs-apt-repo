name: Publish APT feed

on:
  push:
    branches:
      - main
    paths:
      - 'debs/*.deb'
      - 'CydiaIcon.png'
      - '.github/workflows/publish-apt.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Debian package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Generate APT indexes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(debs/*.deb)
          if (("${#packages[@]}" == 0)); then
            echo "No .deb packages found directly in debs/" >&2
            exit 1
          fi

          mkdir -p _site/debs
          cp "${packages[@]}" _site/debs/

          release_json=$(mktemp)
          trap 'rm -f "$release_json"' EXIT
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/poopterm-labs/poopterm/releases/latest \
            -o "$release_json"
          asset_name=$(jq -r '[.assets[] | select((.name | startswith("poopterm_")) and (.name | endswith("_amd64.deb")))] | first | .name // empty' "$release_json")
          if [[ -n "$asset_name" ]]; then
            if [[ ! "$asset_name" =~ ^poopterm_[0-9A-Za-z.+~-]+_amd64\.deb$ ]]; then
              echo "Unexpected Poopterm package asset name: $asset_name" >&2
              exit 1
            fi
            asset_url=$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .browser_download_url' "$release_json")
            if [[ "$asset_url" != https://github.com/* ]]; then
              echo "Unexpected Poopterm package asset URL" >&2
              exit 1
            fi
            curl -fLsS --retry 3 "$asset_url" -o "_site/debs/$asset_name"
          else
            echo "The latest Poopterm release has no amd64 .deb asset yet; publishing the other packages."
          fi

          packages=(_site/debs/*.deb)
          if (("${#packages[@]}" == 0)); then
            echo "No .deb packages are available to publish" >&2
            exit 1
          fi

          mkdir -p _site
          (
            cd _site
            dpkg-scanpackages --multiversion debs /dev/null > Packages
            gzip -9c Packages > Packages.gz
            cp ../index.html index.html
            cp ../CydiaIcon.png CydiaIcon.png
            touch .nojekyll

            architectures=$(
              for package in debs/*.deb; do
                dpkg-deb -f "$package" Architecture
              done | sort -u | paste -sd ' ' -
            )

            {
              cat <<EOF
          Origin: poopterm-labs
          Label: Poop Labs APT Repository
          Suite: stable
          Codename: stable
          Architectures: $architectures
          Components: main
          Description: Debian and jailbreak packages maintained by poopterm-labs
          Date: $(date -Ru)
          SHA256:
          EOF
              for file in Packages Packages.gz; do
                hash=$(sha256sum "$file" | cut -d' ' -f1)
                size=$(wc -c < "$file" | tr -d ' ')
                printf ' %s %s %s\\n' "$hash" "$size" "$file"
              done
            } > Release
          )

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
